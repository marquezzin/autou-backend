name: keep-backend-awake

on:
  schedule:
    - cron: "*/10 * * * *"   # roda a cada 10 minutos (UTC)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit healthcheck
        run: |
          curl -sS -m 15 https://autou-backend-wr7t.onrender.com/health || true
